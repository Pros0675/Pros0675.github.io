<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Series Admin - Prosper Movies</title>
<style>
  :root{--bg:#090b12;--panel:#121622;--light:#1b2232;--text:#f5f7fb;--muted:#aab2c5;--accent:#7c5cff;--border:#293044;--danger:#e0546f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
  button,input,textarea{font:inherit}
  button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:bold}
  button:disabled{opacity:.6;cursor:wait}
  button.sec{background:var(--light)}
  button.del{background:#3a1c28;color:#ffc0ce}
  button.sm{padding:6px 10px;font-size:13px}
  input,textarea{width:100%;padding:12px;background:#070910;color:#fff;border:1px solid var(--border);border-radius:9px}
  textarea{min-height:90px;resize:vertical}
  label{display:block;margin:14px 0 6px;color:var(--muted)}
  .wrap{max-width:860px;margin:auto;padding:16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:18px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row.between{justify-content:space-between}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .muted{color:var(--muted)}
  .msg{padding:12px;border-radius:9px;margin-bottom:14px;background:#172b2a;color:#a8ffeb;overflow-wrap:anywhere}
  .msg.err{background:#3a1c28;color:#ffc0ce}
  .hidden{display:none!important}
  .season{border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:14px;background:var(--bg)}
  .ep{display:grid;grid-template-columns:54px 1fr;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
  .ep .num{width:54px;text-align:center;padding:12px 4px}
  .ep .fields{display:grid;gap:8px}
  .ep .tools{display:flex;gap:6px;flex-wrap:wrap}
  .saved{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
  @media(max-width:550px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="row between" style="margin-bottom:14px">
    <h1 style="margin:0;font-size:24px">📺 Series Admin</h1>
    <div class="row">
      <a href="./admin.html" class="muted">Filamu</a>
      <a href="./index.html" class="muted">Mwanzo</a>
      <button id="logoutBtn" class="sec sm hidden">Toka</button>
    </div>
  </div>

  <div id="msg" class="msg hidden" role="status"></div>

  <!-- LOGIN -->
  <div id="loginCard" class="card hidden">
    <h2 style="margin-top:0">Ingia (Admin)</h2>
    <form id="loginForm">
      <label for="email">Barua pepe</label>
      <input id="email" type="email" required>
      <label for="password">Nenosiri</label>
      <input id="password" type="password" required>
      <div class="row" style="margin-top:14px"><button type="submit">Ingia</button></div>
    </form>
  </div>

  <div id="app" class="hidden">

    <!-- SERIES INFO -->
    <div class="card">
      <div class="row between">
        <h2 id="formTitle" style="margin:0">Series mpya</h2>
        <button id="newBtn" class="sec sm hidden">+ Series nyingine</button>
      </div>

      <label for="title">Jina la series</label>
      <input id="title" placeholder="Mfano: Money Heist">

      <div class="grid2">
        <div><label for="year">Mwaka</label><input id="year" placeholder="2026"></div>
        <div><label for="imdb">IMDb ID (hiari)</label><input id="imdb" placeholder="tt1234567"></div>
      </div>

      <label for="poster">Poster URL</label>
      <input id="poster" placeholder="https://example.com/poster.jpg">

      <label for="desc">Maelezo</label>
      <textarea id="desc"></textarea>

      <label for="price">Bei ya series nzima (TSh), 0 = bure</label>
      <input id="price" type="number" min="0" step="100" value="0">
    </div>

    <!-- SEASONS -->
    <div class="card">
      <div class="row between">
        <h2 style="margin:0">Seasons na Episodes</h2>
        <button id="addSeason" class="sec">+ Ongeza Season</button>
      </div>
      <p class="muted" style="margin:8px 0 0">Episodes zinaonekana kwa mpangilio wa namba. Tumia ▲ ▼ kubadilisha nafasi.</p>
      <div id="seasons"></div>
    </div>

    <div class="row" style="margin-bottom:22px">
      <button id="saveBtn">💾 Hifadhi Series</button>
    </div>

    <!-- EXISTING -->
    <div class="card">
      <h2 style="margin-top:0">Series zilizohifadhiwa</h2>
      <div id="list" class="muted">Inapakia...</div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAMt3bDm-DtkwAHizrs6f2EB8rsXAu9FKs",
  authDomain: "prosper-movie-36bfb.firebaseapp.com",
  projectId: "prosper-movie-36bfb",
  storageBucket: "prosper-movie-36bfb.firebasestorage.app",
  messagingSenderId: "869131612157",
  appId: "1:869131612157:web:145fdd0bf412d623b3b394"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const $ = id => document.getElementById(id);

/* state: seasons = [{ number, episodes: [{ number, title, videoUrl }] }] */
let seasons = [];
let editingId = null;

function msg(text, err = false) {
  const el = $("msg");
  el.textContent = text;
  el.className = "msg" + (err ? " err" : "");
}

/* ---------- AUTH ---------- */
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  try {
    await auth.signInWithEmailAndPassword($("email").value.trim(), $("password").value);
  } catch (err) { msg("Barua pepe au nenosiri si sahihi.", true); }
});
$("logoutBtn").addEventListener("click", () => auth.signOut());

auth.onAuthStateChanged(async user => {
  $("loginCard").classList.toggle("hidden", !!user);
  $("logoutBtn").classList.toggle("hidden", !user);
  $("app").classList.add("hidden");
  if (!user) return;
  try {
    const admins = ["prospermgimba9@gmail.com", "erickturwa0@gmail.com"];
    if (!admins.includes((user.email || "").toLowerCase())) {
      msg("Umeingia kama " + (user.email || "?") + ", ambayo si admin. Bonyeza Toka, kisha ingia kwa barua pepe ya admin.", true);
      return;
    }
    if (user.emailVerified) {
      $("msg").className = "msg hidden";
    } else {
      msg("Barua pepe yako haijathibitishwa. Thibitisha kupitia kiungo kilichotumwa na Firebase, vinginevyo kuhifadhi kutakataliwa.", true);
    }
    $("app").classList.remove("hidden");
    newSeries();
    loadList();
  } catch (err) { msg(err.message, true); }
});

/* ---------- SEASONS UI ---------- */
function renumber(season) {
  season.episodes.forEach((ep, i) => ep.number = i + 1);
}

function field(value, placeholder, onInput, cls) {
  const i = document.createElement("input");
  i.value = value || "";
  i.placeholder = placeholder;
  if (cls) i.className = cls;
  i.addEventListener("input", () => onInput(i.value));
  return i;
}

function btn(text, cls, onClick) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = text;
  b.className = cls;
  b.addEventListener("click", onClick);
  return b;
}

function move(arr, i, dir) {
  const j = i + dir;
  if (j < 0 || j >= arr.length) return false;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  return true;
}

function render() {
  const box = $("seasons");
  box.replaceChildren();

  if (!seasons.length) {
    const p = document.createElement("p");
    p.className = "muted";
    p.textContent = "Bado hakuna season. Bonyeza \"+ Ongeza Season\".";
    box.append(p);
    return;
  }

  seasons.forEach((season, si) => {
    const sBox = document.createElement("div");
    sBox.className = "season";

    const head = document.createElement("div");
    head.className = "row between";
    const h = document.createElement("h3");
    h.style.margin = "0";
    h.textContent = "Season " + season.number;
    const tools = document.createElement("div");
    tools.className = "row";
    tools.append(
      btn("▲", "sec sm", () => { if (move(seasons, si, -1)) { seasons.forEach((s, i) => s.number = i + 1); render(); } }),
      btn("▼", "sec sm", () => { if (move(seasons, si, 1)) { seasons.forEach((s, i) => s.number = i + 1); render(); } }),
      btn("Futa Season", "del sm", () => {
        if (!confirm("Futa Season " + season.number + " na episodes zake zote?")) return;
        seasons.splice(si, 1);
        seasons.forEach((s, i) => s.number = i + 1);
        render();
      })
    );
    head.append(h, tools);
    sBox.append(head);

    season.episodes.forEach((ep, ei) => {
      const row = document.createElement("div");
      row.className = "ep";

      const num = document.createElement("input");
      num.className = "num";
      num.value = ep.number;
      num.disabled = true;

      const fields = document.createElement("div");
      fields.className = "fields";
      fields.append(
        field(ep.title, "Jina la episode (hiari)", v => ep.title = v),
        field(ep.videoUrl, "URL ya video (HTTPS: Dropbox, .mp4, YouTube)", v => ep.videoUrl = v)
      );

      const t = document.createElement("div");
      t.className = "tools";
      t.append(
        btn("▲", "sec sm", () => { if (move(season.episodes, ei, -1)) { renumber(season); render(); } }),
        btn("▼", "sec sm", () => { if (move(season.episodes, ei, 1)) { renumber(season); render(); } }),
        btn("Futa", "del sm", () => { season.episodes.splice(ei, 1); renumber(season); render(); })
      );
      fields.append(t);

      row.append(num, fields);
      sBox.append(row);
    });

    const add = btn("+ Ongeza Episode", "sec sm", () => {
      season.episodes.push({ number: season.episodes.length + 1, title: "", videoUrl: "" });
      render();
    });
    add.style.marginTop = "12px";
    sBox.append(add);

    box.append(sBox);
  });
}

$("addSeason").addEventListener("click", () => {
  seasons.push({ number: seasons.length + 1, episodes: [{ number: 1, title: "", videoUrl: "" }] });
  render();
});

/* ---------- FORM ---------- */
function newSeries() {
  editingId = null;
  seasons = [];
  ["title", "year", "imdb", "poster", "desc"].forEach(id => $(id).value = "");
  $("price").value = "0";
  $("formTitle").textContent = "Series mpya";
  $("newBtn").classList.add("hidden");
  render();
}
$("newBtn").addEventListener("click", newSeries);

function isHttps(u) {
  try { return new URL(u).protocol === "https:"; } catch (e) { return false; }
}

/* Funguo za link za siri: "season_episode", mfano "1_3" */
function urlKey(season, ep) {
  return season.number + "_" + ep.number;
}

$("saveBtn").addEventListener("click", async () => {
  const title = $("title").value.trim();
  if (!title) return msg("Andika jina la series.", true);
  if (!seasons.length) return msg("Ongeza angalau season moja.", true);

  for (const s of seasons) {
    if (!s.episodes.length) return msg("Season " + s.number + " haina episode.", true);
    for (const ep of s.episodes) {
      if (!isHttps((ep.videoUrl || "").trim()))
        return msg("Season " + s.number + " Episode " + ep.number + ": URL ya video lazima iwe HTTPS.", true);
    }
  }

  const price = Math.max(0, parseInt($("price").value, 10) || 0);
  const paid = price > 0;

  /* Series ya malipo: link hazibaki kwenye "series", zinaenda "seriesSecrets" */
  const secretUrls = {};
  const data = {
    title,
    year: $("year").value.trim(),
    imdbID: $("imdb").value.trim(),
    poster: $("poster").value.trim(),
    description: $("desc").value.trim(),
    price: price,
    seasons: seasons.map(s => ({
      number: s.number,
      episodes: s.episodes.map(ep => {
        const url = ep.videoUrl.trim();
        if (paid) secretUrls[urlKey(s, ep)] = url;
        return {
          number: ep.number,
          title: (ep.title || "").trim(),
          videoUrl: paid ? "" : url
        };
      })
    })),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  $("saveBtn").disabled = true;
  try {
    const isNew = !editingId;
    const ref = isNew ? db.collection("series").doc() : db.collection("series").doc(editingId);
    if (isNew) data.createdAt = firebase.firestore.FieldValue.serverTimestamp();

    const batch = db.batch();
    batch.set(ref, data, { merge: true });

    const secretRef = db.collection("seriesSecrets").doc(ref.id);
    if (paid) batch.set(secretRef, { urls: secretUrls });
    else batch.delete(secretRef);

    await batch.commit();

    editingId = ref.id;
    $("formTitle").textContent = "Hariri: " + title;
    $("newBtn").classList.remove("hidden");

    msg("Series imehifadhiwa.");
    loadList();
  } catch (err) {
    msg(err.code === "permission-denied"
      ? "Huna ruhusa. Hakikisha Firestore rules za \"series\" na \"seriesSecrets\" zimewekwa na barua pepe yako imethibitishwa."
      : err.message, true);
  } finally {
    $("saveBtn").disabled = false;
  }
});

/* ---------- LIST ---------- */
async function loadList() {
  const list = $("list");
  try {
    const snap = await db.collection("series").get();
    list.replaceChildren();
    if (snap.empty) { list.textContent = "Bado hakuna series."; return; }

    snap.docs.forEach(doc => {
      const d = doc.data();
      const row = document.createElement("div");
      row.className = "saved";

      const info = document.createElement("div");
      const eps = (d.seasons || []).reduce((n, s) => n + s.episodes.length, 0);
      const t = document.createElement("strong");
      t.textContent = d.title;
      const sub = document.createElement("div");
      sub.className = "muted";
      sub.style.fontSize = "13px";
      sub.textContent =
        (d.seasons || []).length + " season, " + eps + " episodes" +
        (d.price > 0 ? " · TSh " + d.price : " · Bure");
      info.append(t, sub);

      const tools = document.createElement("div");
      tools.className = "row";
      tools.append(
        btn("Hariri", "sec sm", async () => {
          const copy = JSON.parse(JSON.stringify(d.seasons || []));

          if (d.price > 0) {
            try {
              const sec = await db.collection("seriesSecrets").doc(doc.id).get();
              const urls = sec.exists ? (sec.data().urls || {}) : {};
              copy.forEach(s => s.episodes.forEach(ep => {
                ep.videoUrl = urls[urlKey(s, ep)] || "";
              }));
            } catch (err) {
              return msg("Imeshindikana kusoma link za siri: " + err.message, true);
            }
          }

          editingId = doc.id;
          $("title").value = d.title || "";
          $("year").value = d.year || "";
          $("imdb").value = d.imdbID || "";
          $("poster").value = d.poster || "";
          $("desc").value = d.description || "";
          $("price").value = d.price || 0;
          seasons = copy;
          $("formTitle").textContent = "Hariri: " + d.title;
          $("newBtn").classList.remove("hidden");
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }),
        btn("Futa", "del sm", async () => {
          if (!confirm("Futa series \"" + d.title + "\"?")) return;
          try {
            const b = db.batch();
            b.delete(db.collection("series").doc(doc.id));
            b.delete(db.collection("seriesSecrets").doc(doc.id));
            await b.commit();
            if (editingId === doc.id) newSeries();
            msg("Series imefutwa.");
            loadList();
          } catch (err) { msg(err.message, true); }
        })
      );
      row.append(info, tools);
      list.append(row);
    });
  } catch (err) {
    list.textContent = "Imeshindikana kupakia.";
    msg(err.code === "permission-denied" ? "Huna ruhusa ya kusoma collection \"series\"." : err.message, true);
  }
}
</script>
</body>
</html>
