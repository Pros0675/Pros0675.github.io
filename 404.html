<style>
:root{--bg:#0c0a14;--panel:#15122a;--text:#f6f3ff;--muted:#a29dbd;--accent:#8b6bff;--gold:#ffc857;--border:#2a2548}

.btn{display:inline-block;margin-top:22px;background:var(--accent);color:#fff;text-decoration:none;padding:12px 20px;border-radius:12px;font-weight:700}
footer{margin-top:34px;text-align:center;color:var(--muted);font-size:13px}

.c{min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
