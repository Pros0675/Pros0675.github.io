<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0a14">
<meta name="description" content="Prosper Movies — tazama filamu na series, hifadhi unazopenda.">
<title>Prosper Movies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0a14; --panel:#15122a; --panel2:#1e1a38; --text:#f6f3ff; --muted:#a29dbd;
  --accent:#8b6bff; --gold:#ffc857; --border:#2a2548; --danger:#ff7a93; --ok:#6be3b4;
  --display:"Bricolage Grotesque","Trebuchet MS",Arial,sans-serif;
  --body:"DM Sans",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.45;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:11px 16px;background:var(--accent);color:#fff;font-weight:700}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.6;cursor:wait}
button.ghost{background:var(--panel2);color:var(--text)}
button.sm{padding:8px 12px;font-size:13px;border-radius:10px}
input{width:100%;padding:13px 14px;background:var(--panel);color:#fff;border:1px solid var(--border);border-radius:12px}
a{color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}

/* top bar */
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;
  padding:calc(12px + env(safe-area-inset-top)) 18px 12px;background:linear-gradient(#0c0a14ee,#0c0a14aa);backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:-.02em}
.logo svg{width:26px;height:26px}
.logo b{color:var(--accent);font-weight:800}

.wrap{max-width:1100px;margin:auto}
.view{display:none}
.view.active{display:block}
