<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b12">
  <meta name="description" content="Prosper Movies — tafuta filamu na hifadhi unazopenda.">
  <title>Prosper Movies</title>

  <!-- LETA MAKTABA YA KISASA YA KUSOMA VIDEO KUBWA (VIDEO.JS CSS) -->
  <link href="https://zencdn.net" rel="stylesheet" />

  <style>
    :root {
      --bg: #090b12;
      --panel: #121622;
      --panel-light: #1b2232;
      --text: #f5f7fb;
      --muted: #aab2c5;
      --accent: #7c5cff;
      --border: #293044;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Arial, sans-serif; }
    button, input { font: inherit; }
    button {
      cursor: pointer; border: 0; border-radius: 9px; padding: 11px 15px;
      background: var(--accent); color: white; font-weight: bold;
    }
    button:disabled { opacity: .6; cursor: wait; }
    input {
      width: 100%; padding: 12px; background: var(--panel); color: white;
      border: 1px solid var(--border); border-radius: 9px;
    }
    .container { max-width: 1200px; margin: auto; padding: 18px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .logo { font-size: 25px; font-weight: 900; }
    .logo span { color: var(--accent); }
    .header-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .secondary { background: var(--panel-light); }
    .search-form { display: flex; gap: 9px; margin: 25px 0; }
    .search-form input { flex: 1; min-width: 0; }
    h2 { margin-top: 25px; }
    .muted { color: var(--muted); }
    .message {
      background: #172b2a; color: #a8ffeb; padding: 12px; margin: 15px 0;
      border-radius: 9px; overflow-wrap: anywhere;
    }
    .hidden { display: none !important; }
    .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 16px; margin-top: 20px; }
    .movie-card { background: var(--panel); border: 1px solid var(--border); border-radius: 13px; overflow: hidden; }
    .movie-card img { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; background: var(--panel-light); }
    .movie-info { padding: 11px; }
    .movie-title { font-weight: bold; line-height: 1.4; }
    .movie-year { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .movie-card button { width: 100%; margin-top: 10px; }
    .empty {
      padding: 25px; border: 1px dashed var(--border); border-radius: 12px;
      color: var(--muted); text-align: center; grid-column: 1 / -1;
    }
    .modal {
      position: fixed; inset: 0; z-index: 20; background: #000c;
      display: grid; place-items: center; padding: 15px;
    }
    .modal-box {
      width: min(540px, 100%); max-height: 90vh; overflow-y: auto;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 15px; padding: 20px;
    }
    .modal-box label { display: block; margin: 14px 0 7px; color: var(--muted); }
    .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; }
    .detail-layout { display: grid; grid-template-columns: 145px 1fr; gap: 16px; }
    .detail-layout img { width: 100%; border-radius: 9px; }
    
    /* MPANGILIO WA KICHEZA VIDEO (SAFI KABISA BILA MAKOSA) */
    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 9px;
      overflow: hidden;
      background: black;
      margin-bottom: 15px;
    }
    .video-js {
      width: 100% !important;
      height: 100% !important;
    }

    footer { text-align: center; color: var(--muted); font-size: 13px; margin: 35px 0 15px; }

    @media (max-width: 550px) {
      .container { padding: 12px; }
      .logo { font-size: 21px; }
      .movie-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .detail-layout { grid-template-columns: 1fr; }
      .detail-layout img { max-width: 170px; }
      .search-form button { padding: 10px; }
    }
  </style>
</head>

<body>
<a href="./admin.html" style="position:fixed;bottom:10px;right:10px;font-size:12px;opacity:.6;color:#b7aaff">Admin</a>

<div class="container">

  <header>
    <div class="logo">🍿 <span>Prosper</span> Movies</div>

    <div class="header-buttons">
      <button id="savedBtn" class="secondary">❤️ Zilizohifadhiwa</button>
      <button id="loginBtn">Ingia / Jisajili</button>
      <button id="logoutBtn" class="secondary hidden">Toka</button>
      <a id="adminLink" class="hidden" href="./admin.html">Admin</a>
    </div>
  </header>

  <div id="message" class="message hidden" role="status"></div>

  <section id="intro"></section>

  <h2>🎞️ Filamu Zetu</h2>
  <div id="ownGrid" class="movie-grid">
    <div class="empty">Inapakia...</div>
  </div>

  <form id="searchForm" class="search-form">
    <input id="searchInput" type="search" placeholder="🔎 Tafuta filamu..." aria-label="Tafuta filamu" required>
    <button type="submit">Tafuta</button>
  </form>

  <h2 id="sectionTitle">🎬 Tafuta Filamu</h2>
  <p id="sectionDescription" class="muted">Andika jina la filamu ili kuona matokeo.</p>

  <div id="movieGrid" class="movie-grid">
    <div class="empty">Karibu Prosper Movies! Tafuta filamu unayoipenda.</div>
  </div>

  <!-- SCRIPT KUTOKA VIDEO.JS INAYOLAZIMISHA PICHA IONEKANE -->
  <script src="https://zencdn.net"></script>

  <footer>© 2026 Prosper Movies. Haki zote zimehifadhiwa.</footer>
</div>
</body>
</html>
