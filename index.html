<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Prosper Movies</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #141c2e;
      --panel2: #1a2438;
      --line: #243049;
      --red: #e5262d;
      --red-glow: rgba(229, 38, 45, 0.35);
      --text: #f0f4ff;
      --muted: #8b9bb8;
      --ok: #3ecf8e;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ========== SPLASH / INTRO ========== */
    #splash {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, #1a2438 0%, #0b1220 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s;
    }
    #splash.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .logo-big {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #fff 30%, var(--red));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulse 2s ease-in-out infinite;
    }
    .tagline {
      color: var(--muted);
      margin-top: 12px;
      font-size: 1rem;
      letter-spacing: 1px;
    }
    .loader {
      width: 48px;
      height: 4px;
      background: var(--line);
      border-radius: 4px;
      margin-top: 40px;
      overflow: hidden;
    }
    .loader::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: var(--red);
      border-radius: 4px;
      animation: load 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.04); opacity: 0.9; }
    }
    @keyframes load {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* ========== AUTH SCREEN ========== */
    #auth {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9000;
      padding: 20px;
    }
    #auth.show { display: flex; }

    .auth-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 36px 28px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .auth-card h2 {
      font-size: 1.6rem;
      margin-bottom: 6px;
    }
    .auth-card p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      background: var(--panel2);
      padding: 4px;
      border-radius: 12px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      color: var(--muted);
      transition: all 0.25s;
    }
    .tab.active {
      background: var(--red);
      color: white;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }
    .form-group input:focus {
      border-color: var(--red);
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
    }
    .btn-primary {
      background: var(--red);
      color: white;
      margin-top: 8px;
      box-shadow: 0 8px 24px var(--red-glow);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px var(--red-glow);
    }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      margin-top: 12px;
    }
    .error {
      color: #ff6b6b;
      font-size: 0.85rem;
      margin-top: 12px;
      display: none;
    }

    /* ========== MAIN APP ========== */
    #app {
      display: none;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }
    #app.show { display: block; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-top: 8px;
    }
    .logo {
      font-size: 1.45rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, var(--red));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--red), #ff6b6b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
    }
    .logout {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .search-bar {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .search-bar input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 1rem;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title span {
      color: var(--red);
    }

    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 18px;
    }
    .movie-card {
      background: var(--panel);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--line);
      transition: all 0.3s;
      cursor: pointer;
    }
    .movie-card:hover {
      transform: translateY(-6px);
      border-color: var(--red);
      box-shadow: 0 12px 30px rgba(229, 38, 45, 0.2);
    }
    .poster {
      height: 210px;
      background: linear-gradient(135deg, #1a2438, #2a3548);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      position: relative;
    }
    .poster .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--red);
      color: white;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .movie-info {
      padding: 12px;
    }
    .movie-info h3 {
      font-size: 0.95rem;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .movie-info p {
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* Bottom nav (mobile) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(20, 28, 46, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-around;
      padding: 12px 0 18px;
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font-size: 0.75rem;
      cursor: pointer;
    }
    .nav-item.active { color: var(--red); }
    .nav-item svg { width: 22px; height: 22px; }

    @media (min-width: 768px) {
      .bottom-nav { display: none; }
      .movies-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    }
  </style>
</head>
<body>

  <!-- SPLASH / INTRO -->
  <div id="splash">
    <div class="logo-big">PROSPER</div>
    <div class="tagline">MOVIES • FILAMU ZA KISASA</div>
    <div class="loader"></div>
  </div>

  <!-- AUTH (Login / Sign Up) -->
  <div id="auth">
    <div class="auth-card">
      <h2 id="authTitle">Karibu tena</h2>
      <p id="authSubtitle">Ingia ili uendelee kutazama filamu</p>

      <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">Ingia</div>
        <div class="tab" onclick="switchTab('signup')">Jisajili</div>
      </div>

      <form id="authForm" onsubmit="handleAuth(event)">
        <div class="form-group" id="nameGroup" style="display:none;">
          <label>Jina kamili</label>
          <input type="text" id="name" placeholder="Andika jina lako">
        </div>
        <div class="form-group">
          <label>Barua pepe</label>
          <input type="email" id="email" placeholder="mfano@email.com" required>
        </div>
        <div class="form-group">
          <label>Nenosiri</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" id="authBtn">Ingia</button>
        <div class="error" id="errorMsg"></div>
      </form>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app">
    <header>
      <div class="logo">Prosper Movies</div>
      <div class="user-area">
        <div class="avatar" id="userAvatar">P</div>
        <button class="logout" onclick="logout()">Toka</button>
      </div>
    </header>

    <div class="search-bar">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input type="text" placeholder="Tafuta filamu, mfululizo...">
    </div>

    <div class="section-title">
      <span>🔥</span> Filamu Maarufu
    </div>

    <div class="movies-grid" id="moviesGrid">
      <!-- Movies will be injected by JS -->
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav" id="bottomNav" style="display:none;">
    <div class="nav-item active">
      <svg fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Nyumbani
    </div>
    <div class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      Tafuta
    </div>
    <div class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
      Orodha
    </div>
    <div class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      Akaunti
    </div>
  </div>

  <script>
    // Sample movies
    const movies = [
      { title: "Black Panther", year: "2018", emoji: "🐆", badge: "HD" },
      { title: "Avengers: Endgame", year: "2019", emoji: "🦸", badge: "4K" },
      { title: "The Batman", year: "2022", emoji: "🦇", badge: "HD" },
      { title: "Spider-Man", year: "2021", emoji: "🕷️", badge: "4K" },
      { title: "Dune", year: "2021", emoji: "🏜️", badge: "HD" },
      { title: "Top Gun: Maverick", year: "2022", emoji: "✈️", badge: "4K" },
      { title: "John Wick 4", year: "2023", emoji: "🔫", badge: "HD" },
      { title: "Oppenheimer", year: "2023", emoji: "💥", badge: "4K" },
    ];

    let isLogin = true;

    // Show splash then decide
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        document.getElementById("splash").classList.add("hide");
        
        const user = localStorage.getItem("prosper_user");
        if (user) {
          showApp(JSON.parse(user));
        } else {
          document.getElementById("auth").classList.add("show");
        }
      }, 2600); // Intro inaonekana kwa sekunde \~2.6
    });

    function switchTab(type) {
      isLogin = type === "login";
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      event.target.classList.add("active");

      document.getElementById("nameGroup").style.display = isLogin ? "none" : "block";
      document.getElementById("authTitle").textContent = isLogin ? "Karibu tena" : "Unda akaunti";
      document.getElementById("authSubtitle").textContent = isLogin 
        ? "Ingia ili uendelee kutazama filamu" 
        : "Jisajili haraka na uanze kutazama";
      document.getElementById("authBtn").textContent = isLogin ? "Ingia" : "Jisajili";
      document.getElementById("errorMsg").style.display = "none";
    }

    function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const name = document.getElementById("name").value.trim();

      if (!email || !password) {
        showError("Tafadhali jaza sehemu zote");
        return;
      }

      if (!isLogin && !name) {
        showError("Andika jina lako");
        return;
      }

      // Simple simulation
      const user = {
        name: isLogin ? email.split("@")[0] : name,
        email: email
      };

      localStorage.setItem("prosper_user", JSON.stringify(user));
      document.getElementById("auth").classList.remove("show");
      showApp(user);
    }

    function showApp(user) {
      document.getElementById("app").classList.add("show");
      document.getElementById("bottomNav").style.display = "flex";
      document.getElementById("userAvatar").textContent = user.name.charAt(0).toUpperCase();

      // Render movies
      const grid = document.getElementById("moviesGrid");
      grid.innerHTML = movies.map(m => `
        <div class="movie-card">
          <div class="poster">
            ${m.emoji}
            <span class="badge">${m.badge}</span>
          </div>
          <div class="movie-info">
            <h3>${m.title}</h3>
            <p>${m.year}</p>
          </div>
        </div>
      `).join("");
    }

    function logout() {
      localStorage.removeItem("prosper_user");
      location.reload();
    }

    function showError(msg) {
      const el = document.getElementById("errorMsg");
      el.textContent = msg;
      el.style.display = "block";
    }
  </script>
</body>
</html>
