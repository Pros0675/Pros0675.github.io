<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b12">
  <meta name="description" content="Prosper Movies — Tazama na hifadhi filamu unazopenda.">
  <title>Prosper Movies</title>

  <style>
    :root {
      --bg: #090b12;
      --panel: #121622;
      --panel-light: #1b2232;
      --text: #f5f7fb;
      --muted: #aab2c5;
      --accent: #7c5cff;
      --border: #293044;
      --ok: #3ecf8e;
      --red: #e5262d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; border: 0; border-radius: 9px; padding: 11px 15px; background: var(--accent); color: white; font-weight: 600; }
    button:disabled { opacity:.6; cursor: wait; }
    input { width: 100%; padding: 12px; background: var(--panel); color: white; border: 1px solid var(--border); border-radius: 9px; }
    input:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .container { max-width: 1200px; margin: auto; padding: 18px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .logo { font-size: 25px; font-weight: 900; }
    .logo span { color: var(--accent); }
    .header-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .secondary { background: var(--panel-light); }
    .search-form { display: flex; gap: 9px; margin: 25px 0; }
    .search-form input { flex: 1; min-width: 0; }
    h2 { margin: 30px 0 15px; font-size: 1.4rem; }
    .muted { color: var(--muted); }
    .message { background: #172b2a; color: #a8ffeb; padding: 12px; margin: 15px 0; border-radius: 9px; overflow-wrap: anywhere; }
    .hidden { display: none !important; }
    .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-top: 20px; }
    .movie-card { background: var(--panel); border: 1px solid var(--border); border-radius: 13px; overflow: hidden; display: flex; flex-direction: column; }
    .movie-card img { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; background: var(--panel-light); }
    .movie-info { padding: 12px; flex: 1; display: flex; flex-direction: column; }
    .movie-title { font-weight: bold; line-height: 1.4; font-size: 0.95rem; }
    .movie-year { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .movie-price { color: var(--ok); font-size: 13px; margin-top: 4px; font-weight: 600; }
    .movie-card button { width: 100%; margin-top: auto; padding: 10px; font-size: 0.9rem; }
    .empty { padding: 40px 20px; border: 1px dashed var(--border); border-radius: 12px; color: var(--muted); text-align: center; grid-column: 1 / -1; }
    .modal { position: fixed; inset: 0; z-index: 20; background: #000c; display: grid; place-items: center; padding: 15px; }
    .modal-box { width: min(540px, 100%); max-height: 90vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 15px; padding: 20px; }
    .modal-box label { display: block; margin: 14px 0 7px; color: var(--muted); }
    .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; }
    .detail-layout { display: grid; grid-template-columns: 145px 1fr; gap: 16px; }
    .detail-layout img { width: 100%; border-radius: 9px; }
    .player { width: 100%; aspect-ratio: 16 / 9; border: 0; background: black; border-radius: 9px; }
    footer { text-align: center; color: var(--muted); font-size: 13px; margin: 40px 0 15px; }
    .intro-container { margin: 20px 0; border-radius: 12px; overflow: hidden; }
    .intro-container video, .intro-container img { width: 100%; display: block; max-height: 400px; object-fit: cover; }
    .admin-link { background: var(--red); text-decoration: none; display: inline-block; }
    .loader { text-align: center; padding: 40px; color: var(--muted); }
    @media (max-width: 550px) {
      .container { padding: 12px; }
      .logo { font-size: 21px; }
      .movie-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .detail-layout { grid-template-columns: 1fr; }
      .detail-layout img { max-width: 170px; margin: 0 auto; }
    }
  </style>
</head>

<body>
<div class="container">

  <header>
    <div class="logo">🍿 <span>Prosper</span> Movies</div>
    <div class="header-buttons">
      <button id="savedBtn" class="secondary">❤️ Zilizohifadhiwa</button>
      <button id="loginBtn">Ingia / Jisajili</button>
      <button id="logoutBtn" class="secondary hidden">Toka</button>
      <a id="adminLink" class="admin-link hidden" href="./admin.html">Admin</a>
    </div>
  </header>

  <div id="message" class="message hidden" role="status"></div>

  <!-- Intro ya App -->
  <section id="intro" class="intro-container"></section>

  <form id="searchForm" class="search-form">
    <input id="searchInput" type="search" placeholder="🔎 Tafuta filamu..." aria-label="Tafuta filamu">
    <button type="submit">Tafuta</button>
  </form>

  <h2 id="sectionTitle">🎬 Filamu Mpya</h2>
  <p id="sectionDescription" class="muted">Filamu zote kutoka Prosper Movies.</p>

  <div id="movieGrid" class="movie-grid">
    <div class="loader">Inapakia filamu...</div>
  </div>

  <footer>
    © <span id="yearNow"></span> Prosper Movies. Imetengenezwa kwa upendo.
  </footer>

</div>

<!-- LOGIN / SIGNUP -->
<div id="authModal" class="modal hidden">
  <div class="modal-box">
    <h2 id="authTitle">Ingia kwenye akaunti</h2>
    <form id="authForm">
      <label for="email">Barua pepe</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">Nenosiri</label>
      <input id="password" type="password" minlength="6" autocomplete="current-password" required>
      <div class="modal-actions">
        <button id="authSubmit" type="submit">Ingia</button>
        <button id="toggleAuth" type="button" class="secondary">Tengeneza akaunti</button>
        <button type="button" class="secondary" data-close="authModal">Funga</button>
      </div>
    </form>
    <button id="resetPassword" class="secondary" style="margin-top:12px">Nimesahau nenosiri</button>
  </div>
</div>

<!-- MOVIE DETAILS -->
<div id="detailModal" class="modal hidden">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;gap:10px">
      <h2>Maelezo ya Filamu</h2>
      <button type="button" class="secondary" data-close="detailModal">✕</button>
    </div>
    <div id="detailContent"></div>
  </div>
</div>

<!-- VIDEO PLAYER -->
<div id="playerModal" class="modal hidden">
  <div class="modal-box" style="width:min(950px,100%)">
    <div style="display:flex;justify-content:space-between;gap:10px">
      <h2 id="playerTitle">Kicheza Video</h2>
      <button type="button" class="secondary" data-close="playerModal">Funga</button>
    </div>
    <p class="muted">Hakikisha una ruhusa ya kutazama video hii.</p>
    <iframe id="playerFrame" class="player" title="Kicheza video" allowfullscreen referrerpolicy="no-referrer"></iframe>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, query, orderBy, onSnapshot, doc, getDoc, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Badilisha hizi na zako kutoka Firebase Console
  const firebaseConfig = {
    apiKey: "WEKA_FIREBASE_WEB_API_KEY",
    authDomain: "prosper-movie-36bfb.firebaseapp.com",
    projectId: "prosper-movie-36bfb",
    storageBucket: "prosper-movie-36bfb.appspot.com",
    messagingSenderId: "WEKA_MESSAGING_SENDER_ID",
    appId: "WEKA_FIREBASE_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const $ = id => document.getElementById(id);

  let currentUser = null;
  let isAdmin = false;
  let allMovies = [];
  let showingSaved = false;

  $("yearNow").textContent = new Date().getFullYear();
  const placeholderPoster = "data:image/svg+xml,[STRIPPED];

  function showMessage(text, isError = false) {
    const msg = $("message");
    msg.textContent = text;
    msg.className = "message";
    msg.style.background = isError ? "#3d1a1a" : "#172b2a";
    msg.style.color = isError ? "#ff8a8a" : "#a8ffeb";
    msg.classList.remove("hidden");
    setTimeout(() => msg.classList.add("hidden"), 4000);
  }

  /* ---- Auth ---- */
  let authMode = "login";
  $("loginBtn").onclick = () => $("authModal").classList.remove("hidden");
  $("logoutBtn").onclick = () => signOut(auth);
  
  $("toggleAuth").onclick = () => {
    authMode = authMode === "login" ? "signup" : "login";
    $("authTitle").textContent = authMode === "login" ? "Ingia kwenye akaunti" : "Tengeneza akaunti mpya";
    $("authSubmit").textContent = authMode === "login" ? "Ingia" : "Jisajili";
    $("toggleAuth").textContent = authMode === "login" ? "Tengeneza akaunti" : "Nina akaunti";
  };

  $("authForm").onsubmit = async (e) => {
    e.preventDefault();
    const email = $("email").value.trim();
    const pass = $("password").value;
    $("authSubmit").disabled = true;
    try {
      if (authMode === "login") {
        await signInWithEmailAndPassword(auth, email, pass);
      } else {
        await createUserWithEmailAndPassword(auth, email, pass);
      }
      $("authModal").classList.add("hidden");
      $("authForm").reset();
    } catch (e) {
      showMessage(e.message, true);
    }
    $("authSubmit").disabled = false;
  };

  $("resetPassword").onclick = async () => {
    const email = $("email").value.trim();
    if (!email) return showMessage("Weka barua pepe kwanza.", true);
    try {
      await sendPasswordResetEmail(auth, email);
      showMessage("Link ya kubadilisha nenosiri imetumwa kwenye email yako.");
    } catch (e) {
      showMessage("Imeshindwa: " + e.message, true);
    }
  };

  onAuthStateChanged(auth, async user => {
    currentUser = user;
    $("loginBtn").classList.toggle("hidden", !!user);
    $("logoutBtn").classList.toggle("hidden", !user);
    
    if (user) {
      const token = await user.getIdTokenResult();
      isAdmin = token.claims.admin === true;
      $("adminLink").classList.toggle("hidden", !isAdmin);
    } else {
      isAdmin = false;
      $("adminLink").classList.add("hidden");
    }
    
    if (showingSaved) loadSavedMovies();
  });

  /* ---- Load Movies ---- */
  function loadMovies() {
    const q = query(collection(db, "movies"), orderBy("createdAt", "desc"));
    onSnapshot(q, snap => {
      allMovies = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (!showingSaved) renderMovies(allMovies);
    });
  }

  function renderMovies(movies) {
    const grid = $("movieGrid");
    grid.replaceChildren();
    if (movies.length === 0) {
      grid.innerHTML = '<div class="empty">Hakuna filamu iliyopatikana.</div>';
      return;
    }
    movies.forEach(m => {
      const card = document.createElement("div");
      card.className = "movie-card";
      card.innerHTML = `
        <img src="${m.poster || placeholderPoster}" alt="${m.title}" loading="lazy">
        <div class="movie-info">
          <div class="movie-title">${m.title || "Haina Jina"}</div>
          <div class="movie-year">${m.year || ""}</div>
          ${m.price ? `<div class="movie-price">${m.price}</div>` : ""}
          <button type="button">Maelezo Zaidi</button>
        </div>
      `;
      card.querySelector("button").onclick = () => showDetails(m);
      grid.appendChild(card);
    });
  }

  /* ---- Search ---- */
  $("searchForm").onsubmit = (e) => {
    e.preventDefault();
    const q = $("searchInput").value.trim().toLowerCase();
    if (!q) {
      showingSaved = false;
      $("sectionTitle").textContent = "🎬 Filamu Mpya";
      $("sectionDescription").textContent = "Filamu zote kutoka Prosper Movies.";
      renderMovies(allMovies);
      return;
    }
    const filtered = allMovies.filter(m => 
      m.title?.toLowerCase().includes(q) || 
      m.description?.toLowerCase().includes(q) ||
      m.year?.includes(q)
    );
    $("sectionTitle").textContent = `Matokeo: "${q}"`;
    $("sectionDescription").textContent = `${filtered.length} filamu zimepatikana.`;
    renderMovies(filtered);
  };

  /* ---- Saved Movies ---- */
  $("savedBtn").onclick = () => {
    if (!currentUser) return showMessage("Ingia kwanza ili kuona zilizohifadhiwa.", true);
    showingSaved = true;
    $("sectionTitle").textContent = "❤️ Filamu Zilizohifadhiwa";
    $("sectionDescription").textContent = "Filamu ulizohifadhi.";
    loadSavedMovies();
  };

  async function loadSavedMovies() {
    if (!currentUser) return;
    const grid = $("movieGrid");
    grid.innerHTML = '<div class="loader">Inapakia...</div>';
    try {
      const saved = [];
      for (const movie of allMovies) {
        const savedRef = doc(db, "users", currentUser.uid, "savedMovies", movie.id);
        const snap = await getDoc(savedRef);
        if (snap.exists()) saved.push(movie);
      }
      renderMovies(saved);
    } catch (e) {
      grid.innerHTML = '<div class="empty">Imeshindwa kupakia.</div>';
    }
  }

  /* ---- Movie Details ---- */
  async function showDetails(movie) {
    const content = $("detailContent");
    content.innerHTML = `
      <div class="detail-layout">
        <img src="${movie.poster || placeholderPoster}" alt="${movie.title}">
        <div>
          <h3>${movie.title}</h3>
          <p class="muted">${movie.year || ""} ${movie.price ? "| " + movie.price : ""}</p>
          <p style="margin: 16px 0; line-height: 1.6;">${movie.description || "Hakuna maelezo."}</p>
          <div class="modal-actions">
            ${movie.link ? `<button id="playBtn">▶️ Tazama Sasa</button>` : ""}
            <button id="saveBtn" class="secondary">💾 Hifadhi</button>
          </div>
        </div>
      </div>
    `;
    
    if (movie.link) {
      $("playBtn").onclick = () => {
        $("playerTitle").textContent = movie.title;
        $("playerFrame").src = movie.link;
        $("playerModal").classList.remove("hidden");
        $("detailModal").classList.add("hidden");
      };
    }

    const saveBtn = $("saveBtn");
    if (currentUser) {
      const savedRef = doc(db, "users", currentUser.uid, "savedMovies", movie.id);
      const snap = await getDoc(savedRef);
      let isSaved = snap.exists();
      saveBtn.textContent = isSaved ? "✓ Imehifadhiwa" : "💾 Hifadhi";
      
      saveBtn.onclick = async () => {
        saveBtn.disabled = true;
        try {
          if (isSaved) {
            await deleteDoc(savedRef);
            saveBtn.textContent = "💾 Hifadhi";
            showMessage("Imeondolewa kwenye zilizohifadhiwa.");
          } else {
            await setDoc(savedRef, { savedAt: serverTimestamp() });
            saveBtn.textContent = "✓ Imehifadhiwa";
            showMessage("Imehifadhiwa!");
          }
          isSaved = !isSaved;
        } catch (e) {
          showMessage("Imeshindwa: " + e.message, true);
        }
        saveBtn.disabled = false;
      };
    } else {
      saveBtn.onclick = () => {
        $("detailModal").classList.add("hidden");
        $("authModal").classList.remove("hidden");
        showMessage("Ingia kwanza ili kuhifadhi filamu.", true);
      };
    }
    
    $("detailModal").classList.remove("hidden");
  }

  /* ---- Intro ---- */
  async function loadIntro() {
    try {
      const snap = await getDoc(doc(db, "settings", "intro"));
      if (!snap.exists() || !snap.data().url) return;
      const data = snap.data();
      const introEl = $("intro");
      if (data.type === "video") {
        introEl.innerHTML = `<video src="${data.url}" autoplay muted loop playsinline></video>`;
      } else {
        introEl.innerHTML = `<img src="${data.url}" alt="Intro">`;
      }
    } catch (e) {
      console.log("Intro haikupakiwa:", e);
    }
  }

  /* ---- Close Modals ---- */
  document.querySelectorAll("[data-close]").forEach(btn => {
    btn.onclick = () => {
      $(btn.dataset.close).classList.add("hidden");
      if (btn.dataset.close === "playerModal") $("playerFrame").src = "";
    };
  });

  /* ---- Init ---- */
  loadMovies();
  loadIntro();
</script>
</body>
</html>
