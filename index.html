<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b12">
  <meta name="description" content="Prosper Movies — Tazama na hifadhi filamu unazopenda.">
  <title>Prosper Movies</title>
  <style>
    :root { --bg: #090b12; --panel: #121622; --panel-light: #1b2232; --text: #f5f7fb; --muted: #aab2c5; --accent: #7c5cff; --border: #293044; --ok: #3ecf8e; --red: #e5262d; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; border: 0; border-radius: 9px; padding: 11px 15px; background: var(--accent); color: white; font-weight: 600; }
    button:disabled { opacity:.6; cursor: wait; }
    input { width: 100%; padding: 12px; background: var(--panel); color: white; border: 1px solid var(--border); border-radius: 9px; }
    input:focus { outline: 2px solid var(--accent); border-color: transparent; }
   .container { max-width: 1200px; margin: auto; padding: 18px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
   .logo { font-size: 25px; font-weight: 900; }
   .logo span { color: var(--accent); }
   .header-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
   .secondary { background: var(--panel-light); }
   .search-form { display: flex; gap: 9px; margin: 25px 0; }
   .search-form input { flex: 1; min-width: 0; }
    h2 { margin: 30px 0 15px; font-size: 1.4rem; }
   .muted { color: var(--muted); }
   .message { background: #172b2a; color: #a8ffeb; padding: 12px; margin: 15px 0; border-radius: 9px; overflow-wrap: anywhere; }
   .hidden { display: none!important; }
   .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-top: 20px; }
   .movie-card { background: var(--panel); border: 1px solid var(--border); border-radius: 13px; overflow: hidden; display: flex; flex-direction: column; }
   .movie-card img { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; background: var(--panel-light); }
   .movie-info { padding: 12px; flex: 1; display: flex; flex-direction: column; }
   .movie-title { font-weight: bold; line-height: 1.4; font-size: 0.95rem; }
   .movie-year { color: var(--muted); font-size: 13px; margin-top: 6px; }
   .movie-price { color: var(--ok); font-size: 13px; margin-top: 4px; font-weight: 600; }
   .movie-card button { width: 100%; margin-top: auto; padding: 10px; font-size: 0.9rem; }
   .empty { padding: 40px 20px; border: 1px dashed var(--border); border-radius: 12px; color: var(--muted); text-align: center; grid-column: 1 / -1; }
   .modal { position: fixed; inset: 0; z-index: 20; background: #000c; display: grid; place-items: center; padding: 15px; }
   .modal-box { width: min(540px, 100%); max-height: 90vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 15px; padding: 20px; }
   .modal-box label { display: block; margin: 14px 0 7px; color: var(--muted); }
   .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; }
   .detail-layout { display: grid; grid-template-columns: 145px 1fr; gap: 16px; }
   .detail-layout img { width: 100%; border-radius: 9px; }
   .player { width: 100%; aspect-ratio: 16 / 9; border: 0; background: black; border-radius: 9px; }
    footer { text-align: center; color: var(--muted); font-size: 13px; margin: 40px 0 15px; }
   .intro-container { margin: 20px 0; border-radius: 12px; overflow: hidden; }
   .intro-container video,.intro-container img { width: 100%; display: block; max-height: 400px; object-fit: cover; }
   .admin-link { background: var(--red); text-decoration: none; display: inline-block; }
   .loader { text-align: center; padding: 40px; color: var(--muted); }
    @media (max-width: 550px) {.container { padding: 12px; }.logo { font-size: 21px; }.movie-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }.detail-layout { grid-template-columns: 1fr; }.detail-layout img { max-width: 170px; margin: 0 auto; } }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">🍿 <span>Prosper</span> Movies</div>
    <div class="header-buttons">
      <button id="savedBtn" class="secondary">❤️ Zilizohifadhiwa</button>
      <button id="loginBtn">Ingia / Jisajili</button>
      <button id="logoutBtn" class="secondary hidden">Toka</button>
      <a id="adminLink" class="admin-link hidden" href="./admin.html">Admin</a>
    </div>
  </header>
  <div id="message" class="message hidden" role="status"></div>
  <section id="intro" class="intro-container"></section>
  <form id="searchForm" class="search-form">
    <input id="searchInput" type="search" placeholder="🔎 Tafuta filamu..." aria-label="Tafuta filamu">
    <button type="submit">Tafuta</button>
  </form>
  <h2 id="sectionTitle">🎬 Filamu Mpya</h2>
  <p id="sectionDescription" class="muted">Filamu zote kutoka Prosper Movies.</p>
  <div id="movieGrid" class="movie-grid"><div class="loader">Inapakia filamu...</div></div>
  <footer>© <span id="yearNow"></span> Prosper Movies. Imetengenezwa kwa upendo.</footer>
</div>
<div id="authModal" class="modal hidden"><div class="modal-box"><h2 id="authTitle">Ingia kwenye akaunti</h2><form id="authForm"><label for="email">Barua pepe</label><input id="email" type="email" autocomplete="email" required><label for="password">Nenosiri</label><input id="password" type="password" minlength="6" autocomplete="current-password" required><div class="modal-actions"><button id="authSubmit" type="submit">Ingia</button><button id="toggleAuth" type="button" class="secondary">Tengeneza akaunti</button><button type="button" class="secondary" data-close="authModal">Funga</button></div></form><button id="resetPassword" class="secondary" style="margin-top:12px">Nimesahau nenosiri</button></div></div>
<div id="detailModal" class="modal hidden"><div class="modal-box"><div style="display:flex;justify-content:space-between;gap:10px"><h2>Maelezo ya Filamu</h2><button type="button" class="secondary" data-close="detailModal">✕</button></div><div id="detailContent"></div></div></div>
<div id="playerModal" class="modal hidden"><div class="modal-box" style="width:min(950px,100%)"><div style="display:flex;justify-content:space-between;gap:10px"><h2 id="playerTitle">Kicheza Video</h2><button type="button" class="secondary" data-close="playerModal">Funga</button></div><p class="muted">Hakikisha una ruhusa ya kutazama video hii.</p><iframe id="playerFrame" class="player" title="Kicheza video" allowfullscreen referrerpolicy="no-referrer"></iframe></div></div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, query, orderBy, onSnapshot, doc, getDoc, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  const firebaseConfig = { apiKey: "AIzaSyAMt3bDm-DtkwAHizrs6f2EB8rsXAu9FKs", authDomain: "prosper-movie-36bfb.firebaseapp.com", projectId: "prosper-movie-36bfb", storageBucket: "prosper-movie-36bfb.appspot.com", messagingSenderId: "869131612157", appId: "1:869131612157:web:bc17324ea27647d7b3b394" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const $ = id => document.getElementById(id);
  let currentUser = null; let isAdmin = false; let allMovies = []; let showingSaved = false; let unsubscribeMovies = null; let unsubscribeSaved = null;
  $("yearNow").textContent = new Date().getFullYear();
  const placeholderPoster = "data:image/svg+xml,[STRIPPED];
  function showMsg(text, isError = false) { const el = $("message"); el.textContent = text; el.classList.remove("hidden"); el.style.background = isError? "#2b1717" : "#172b2a"; el.style.color = isError? "#ff8a8a" : "#a8ffeb"; setTimeout(() => el.classList.add("hidden"), 4000); }
  function openModal(id) { $(id).classList.remove("hidden"); }
  function closeModal(id) { $(id).classList.add("hidden"); }
  document.querySelectorAll('[data-close]').forEach(btn => btn.onclick = () => closeModal(btn.dataset.close));
  $("loginBtn").onclick = () => openModal("authModal");
  $("logoutBtn").onclick = () => signOut(auth);
  let authMode = "login";
  $("toggleAuth").onclick = () => { authMode = authMode === "login"? "signup" : "login"; $("authTitle").textContent = authMode === "login"? "Ingia kwenye akaunti" : "Tengeneza akaunti mpya"; $("authSubmit").textContent = authMode === "login"? "Ingia" : "Jisajili"; $("toggleAuth").textContent = authMode === "login"? "Tengeneza akaunti" : "Nina akaunti"; };
  $("authForm").onsubmit = async (e) => { e.preventDefault(); const email = $("email").value.trim(); const pass = $("password").value; $("authSubmit").disabled = true; try { if (authMode === "login") { await signInWithEmailAndPassword(auth, email, pass); } else { await createUserWithEmailAndPassword(auth, email, pass); showMsg("Akaunti imetengenezwa!"); } closeModal("authModal"); $("authForm").reset(); } catch (err) { showMsg(err.message, true); } $("authSubmit").disabled = false; };
  $("resetPassword").onclick = async () => { const email = $("email").value.trim(); if (!email) return showMsg("Weka barua pepe kwanza", true); try { await sendPasswordResetEmail(auth, email); showMsg("Tumekutumia link ya kubadilisha nenosiri"); } catch (err) { showMsg(err.message, true); } };
  onAuthStateChanged(auth, async user => { currentUser = user; if (unsubscribeSaved) { unsubscribeSaved(); unsubscribeSaved = null; } if (user) { $("loginBtn").classList.add("hidden"); $("logoutBtn").classList.remove("hidden"); const token = await user.getIdTokenResult(); isAdmin = token.claims.admin === true; if (isAdmin) $("adminLink").classList.remove("hidden"); else $("adminLink").classList.add("hidden"); loadSavedMovies(); } else { $("loginBtn").classList.remove("hidden"); $("logoutBtn").classList.add("hidden"); $("adminLink").classList.add("hidden"); isAdmin = false; if (showingSaved) showAllMovies(); } });
  function loadMovies() { if (unsubscribeMovies) unsubscribeMovies(); const q = query(collection(db, "movies"), orderBy("createdAt", "desc")); unsubscribeMovies = onSnapshot(q, snap => { allMovies = snap.docs.map(d => ({ id: d.id,...d.data() })); if (!showingSaved) renderMovies(allMovies); }, err => { console.error(err); $("movieGrid").innerHTML = '<div class="empty">Imeshindwa kupakia filamu. Hakikisha rules zipo sawa.</div>'; }); }
  function renderMovies(movies) { const grid = $("movieGrid"); if (movies.length === 0) { grid.innerHTML = '<div class="empty">Hakuna filamu kwa sasa.</div>'; return; } grid.innerHTML = movies.map(m => ` <div class="movie-card"> <img src="${m.poster || placeholderPoster}" alt="${m.title}" loading="lazy"> <div class="movie-info"> <div class="movie-title">${m.title}</div> <div class="movie-year">${m.year || ''}</div> ${m.price? `<div class="movie-price">${m.price}</div>` : ''} <button onclick="showDetails('${m.id}')">Maelezo</button> </div> </div> `).join(''); }
  window.showDetails = (id) => { const m = allMovies.find(x => x.id === id); if (!m) return; $("detailContent").innerHTML = ` <div class="detail-layout"> <img src="${m.poster || placeholderPoster}" alt="${m.title}"> <div> <h3>${m.title}</h3> <p class="muted">${m.year || ''} ${m.price? ' | ' + m.price : ''}</p> <p style="margin: 15px 0;">${m.description || 'Hakuna maelezo.'}</p> <div class="modal-actions"> ${m.link? `<button onclick="playMovie('${m.link}', '${m.title}')">Tazama</button>` : ''} ${currentUser? `<button class="secondary" onclick="toggleSave('${m.id}')">❤️ Hifadhi</button>` : ''} </div> </div> </div> `; openModal("detailModal"); };
  window.playMovie = (link, title) => { $("playerTitle").textContent = title; $("playerFrame").src = link; closeModal("detailModal"); openModal("playerModal"); };
  $("playerModal").addEventListener("click", e => { if (e.target.id === "playerModal") $("playerFrame").src = ""; });
  document.querySelector('[data-close="playerModal"]').onclick = () => { $("playerFrame").src = ""; closeModal("playerModal"); };
  function loadSavedMovies() { if (!currentUser) return; const savedRef = collection(db, "users", currentUser.uid, "savedMovies"); unsubscribeSaved = onSnapshot(savedRef, snap => { if (showingSaved) { const savedIds = snap.docs.map(d => d.id); const savedMovies = allMovies.filter(m => savedIds.includes(m.id)); renderMovies(savedMovies); } }); }
  window.toggleSave = async (movieId) => { if (!currentUser) return showMsg("Ingia kwanza kuhifadhi filamu", true); const savedRef = doc(db, "users", currentUser.uid, "savedMovies", movieId); const snap = await getDoc(savedRef); if (snap.exists()) { await deleteDoc(savedRef); showMsg("Imeondolewa kwenye Zilizohifadhiwa"); } else { await setDoc(savedRef, { savedAt: serverTimestamp() }); showMsg("Imehifadhiwa!"); } };
  $("savedBtn").onclick = () => { if (!currentUser) return showMsg("Ingia kwanza kuona Zilizohifadhiwa", true); showingSaved =!showingSaved; if (showingSaved) { $("sectionTitle").textContent = "❤️ Zilizohifadhiwa"; $("sectionDescription").textContent = "Filamu ulizohifadhi."; $("savedBtn").textContent = "📋 Filamu Zote"; loadSavedMovies(); } else { showAllMovies(); } };
  function showAllMovies() { showingSaved = false; $("sectionTitle").textContent = "🎬 Filamu Mpya"; $("sectionDescription").textContent = "Filamu zote kutoka Prosper Movies."; $("savedBtn").textContent = "❤️ Zilizohifadhiwa"; renderMovies(allMovies); }
  $("searchForm").onsubmit = (e) => { e.preventDefault(); const q = $("searchInput").value.trim().toLowerCase(); if (!q) return showAllMovies(); const filtered = allMovies.filter(m => m.title.toLowerCase().includes(q) || (m.description && m.description.toLowerCase().includes(q)) ); $("sectionTitle").textContent = `🔎 Matokeo ya "${q}"`; $("sectionDescription").textContent = `Zimepatikana ${filtered.length} filamu.`; renderMovies(filtered); showingSaved = false; $("savedBtn").textContent = "❤️ Zilizohifadhiwa"; };
  async function loadIntro() { try { const snap = await getDoc(doc(db, "settings", "intro")); if (snap.exists() && snap.data().url) { const d = snap.data(); const el = $("intro"); if (d.type === "video") { el.innerHTML = `<video src="${d.url}" autoplay muted loop playsinline></video>`; } else { el.innerHTML = `<img src="${d.url}" alt="Intro">`; } } } catch (e) { console.log("Intro haipo"); } }
  loadMovies(); loadIntro();
</script>
</body>
</html>
