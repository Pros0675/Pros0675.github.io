<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Prosper Movies</title>
  <style>
    :root { --bg: #090b12; --panel: #121622; --panel-light: #1b2232; --text: #f5f7fb; --muted: #aab2c5; --accent: #7c5cff; --border: #293044; --red: #e5262d; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; border: 0; border-radius: 9px; padding: 11px 15px; background: var(--accent); color: white; font-weight: 600; }
    button:disabled { opacity:.6; cursor: wait; }
    input, textarea, select { width: 100%; padding: 12px; background: var(--panel); color: white; border: 1px solid var(--border); border-radius: 9px; }
    textarea { min-height: 100px; resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); border-color: transparent; }
   .container { max-width: 900px; margin: auto; padding: 18px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
   .logo { font-size: 25px; font-weight: 900; }
   .logo span { color: var(--accent); }
    h2 { margin: 30px 0 15px; font-size: 1.4rem; }
   .muted { color: var(--muted); }
   .message { background: #172b2a; color: #a8ffeb; padding: 12px; margin: 15px 0; border-radius: 9px; overflow-wrap: anywhere; }
   .hidden { display: none!important; }
   .card { background: var(--panel); border: 1px solid var(--border); border-radius: 13px; padding: 20px; margin-bottom: 20px; }
   .card h3 { margin-bottom: 15px; }
   .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
   .form-grid .full { grid-column: 1 / -1; }
   .admin-actions { display: flex; gap: 8px; margin-top: 15px; }
   .secondary { background: var(--panel-light); }
   .danger { background: var(--red); }
   .movie-list { display: grid; gap: 10px; }
   .movie-item { display: flex; gap: 12px; align-items: center; background: var(--panel-light); padding: 10px; border-radius: 9px; }
   .movie-item img { width: 50px; height: 75px; object-fit: cover; border-radius: 5px; }
   .movie-item-info { flex: 1; }
   .movie-item-title { font-weight: 600; }
   .movie-item-year { font-size: 0.8rem; color: var(--muted); }
    @media (max-width: 600px) {.form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">⚙️ <span>Admin</span> Panel</div>
    <div>
      <button id="logoutBtn" class="secondary hidden">Toka</button>
      <a href="./index.html" class="secondary" style="text-decoration:none;display:inline-block;">Rudi Nyumbani</a>
    </div>
  </header>
  <div id="message" class="message hidden" role="status"></div>
  <div id="loginSection" class="card">
    <h3>Ingia kama Msimamizi</h3>
    <form id="loginForm">
      <label for="email">Barua pepe</label>
      <input id="email" type="email" required>
      <label for="password">Nenosiri</label>
      <input id="password" type="password" required>
      <div class="admin-actions"><button type="submit">Ingia</button></div>
    </form>
  </div>
  <div id="adminPanel" class="hidden">
    <div class="card">
      <h3>🎬 Ongeza / Hariri Filamu</h3>
      <form id="movieForm">
        <input type="hidden" id="movieId">
        <div class="form-grid">
          <div><label for="title">Jina la Filamu</label><input id="title" required></div>
          <div><label for="year">Mwaka</label><input id="year"></div>
          <div class="full"><label for="description">Maelezo</label><textarea id="description"></textarea></div>
          <div><label for="poster">Link ya Picha ya Poster</label><input id="poster" type="url" placeholder="https://..."></div>
          <div><label for="link">Link ya Video</label><input id="link" type="url" placeholder="https://..."></div>
          <div><label for="price">Bei</label><input id="price" placeholder="Bure au TZS 2,000"></div>
        </div>
        <div class="admin-actions">
          <button type="submit" id="saveMovieBtn">Hifadhi Filamu</button>
          <button type="button" id="cancelEditBtn" class="secondary hidden">Ghairi</button>
        </div>
      </form>
    </div>
    <div class="card">
      <h3>🖼️ Badilisha Intro ya App</h3>
      <form id="introForm">
        <label for="introUrl">Link ya Picha au Video</label>
        <input id="introUrl" type="url" placeholder="https://...">
        <label for="introType">Aina</label>
        <select id="introType"><option value="image">Picha</option><option value="video">Video</option></select>
        <div class="admin-actions"><button type="submit">Hifadhi Intro</button></div>
      </form>
    </div>
    <div class="card">
      <h3>📋 Orodha ya Filamu</h3>
      <div id="movieList" class="movie-list"><p class="muted">Inapakia...</p></div>
    </div>
  </div>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, query, orderBy, onSnapshot, doc, getDoc, setDoc, deleteDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  const firebaseConfig = { apiKey: "AIzaSyAMt3bDm-DtkwAHizrs6f2EB8rsXAu9FKs", authDomain: "prosper-movie-36bfb.firebaseapp.com", projectId: "prosper-movie-36bfb", storageBucket: "prosper-movie-36bfb.appspot.com", messagingSenderId: "869131612157", appId: "1:869131612157:web:bc17324ea27647d7b3b394" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const $ = id => document.getElementById(id);
  const showMessage = (msg, isError = false) => { const el = $("message"); el.textContent = msg; el.style.display = "block"; el.style.background = isError ? "#3a1520" : "#172b2a"; el.style.color = isError ? "#ff9e9e" : "#a8ffeb"; if (!isError) setTimeout(() => el.style.display = "none", 3500); };
  const placeholderPoster = "data:image/svg+xml,[STRIPPED];
  $("loginForm").addEventListener("submit", async e => { e.preventDefault(); try { await signInWithEmailAndPassword(auth, $("email").value, $("password").value); } catch (err) { showMessage("Imeshindikana: " + err.message, true); } });
  $("logoutBtn").addEventListener("click", () => signOut(auth));
  onAuthStateChanged(auth, async user => { if (user) { const token = await user.getIdTokenResult(); if (token.claims.admin === true) { $("loginSection").classList.add("hidden"); $("adminPanel").classList.remove("hidden"); $("logoutBtn").classList.remove("hidden"); loadMovies(); loadIntro(); } else { showMessage("Akaunti hii haina ruhusa za msimamizi", true); signOut(auth); } } else { $("loginSection").classList.remove("hidden"); $("adminPanel").classList.add("hidden"); $("logoutBtn").classList.add("hidden"); } });
  $("movieForm").addEventListener("submit", async e => { e.preventDefault(); const btn = $("saveMovieBtn"); btn.disabled = true; const id = $("movieId").value; const data = { title: $("title").value.trim(), year: $("year").value.trim(), description: $("description").value.trim(), poster: $("poster").value.trim(), link: $("link").value.trim(), price: $("price").value.trim(), updatedAt: serverTimestamp() }; try { if (id) { await updateDoc(doc(db, "movies", id), data); showMessage("Filamu imehaririwa!"); } else { data.createdAt = serverTimestamp(); await setDoc(doc(collection(db, "movies")), data); showMessage("Filamu imeongezwa!"); } $("movieForm").reset(); $("movieId").value = ""; $("cancelEditBtn").classList.add("hidden"); btn.textContent = "Hifadhi Filamu"; } catch (err) { showMessage("Imeshindikana: " + err.message, true); } finally { btn.disabled = false; } });
  $("cancelEditBtn").addEventListener("click", () => { $("movieForm").reset(); $("movieId").value = ""; $("cancelEditBtn").classList.add("hidden"); $("saveMovieBtn").textContent = "Hifadhi Filamu"; });
  const loadMovies = () => { const q = query(collection(db, "movies"), orderBy("createdAt", "desc")); onSnapshot(q, (snapshot) => { const list = $("movieList"); if (snapshot.empty) { list.innerHTML = `<p class="muted">Hakuna filamu bado. Ongeza moja hapo juu.</p>`; return; } list.innerHTML = snapshot.docs.map(doc => { const m = doc.data(); return `<div class="movie-item"><img src="${m.poster || placeholderPoster}" alt="${m.title}" onerror="this.src='${placeholderPoster}'"><div class="movie-item-info"><div class="movie-item-title">${m.title}</div><div class="movie-item-year">${m.year || ""}</div></div><div><button class="secondary edit-btn" data-id="${doc.id}">Hariri</button><button class="danger delete-btn" data-id="${doc.id}">Futa</button></div></div>`; }).join(""); }); };
  $("movieList").addEventListener("click", async e => { const id = e.target.dataset.id; if (e.target.classList.contains("edit-btn")) { const snap = await getDoc(doc(db, "movies", id)); const m = snap.data(); $("movieId").value = id; $("title").value = m.title || ""; $("year").value = m.year || ""; $("description").value = m.description || ""; $("poster").value = m.poster || ""; $("link").value = m.link || ""; $("price").value = m.price || ""; $("cancelEditBtn").classList.remove("hidden"); $("saveMovieBtn").textContent = "Sasisha Filamu"; window.scrollTo(0, 0); } if (e.target.classList.contains("delete-btn")) { if (confirm(`Una uhakika unataka kufuta filamu hii?`)) { try { await deleteDoc(doc(db, "movies", id)); showMessage("Filamu imefutwa"); } catch (err) { showMessage("Imeshindikana kufuta: " +
