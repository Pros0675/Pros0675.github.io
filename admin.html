<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin - Prosper Movies</title>
  <style>
    :root {
      --bg: #0c0a0a;
      --panel: #181313;
      --line: #2c2222;
      --red: #e5262d;
      --text: #f4eeee;
      --muted: #a39898;
      --ok: #3ecf8e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px 16px 60px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin-bottom: 4px; }
    .sub { color: var(--muted); margin-bottom: 28px; font-size: 0.95rem; }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
    }
    .card h3 {
      font-size: 1.05rem;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 13px 14px;
      background: #221a1a;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 14px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--red);
    }
    textarea { min-height: 90px; resize: vertical; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      background: var(--red);
      color: white;
      transition: 0.2s;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      text-align: center;
    }
    .stat .num {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--red);
    }
    .stat .label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Admin Panel</h1>
    <p class="sub">Prosper Movies • Dhibiti filamu</p>

    <div class="stats">
      <div class="stat">
        <div class="num">24</div>
        <div class="label">Filamu</div>
      </div>
      <div class="stat">
        <div class="num">1.2k</div>
        <div class="label">Watazamaji</div>
      </div>
    </div>

    <div class="card">
      <h3>➕ Ongeza Filamu Mpya</h3>
      <label>Jina la filamu</label>
      <input type="text" placeholder="Mfano: Black Panther">

      <label>Mwaka</label>
      <input type="number" placeholder="2023">

      <label>Aina</label>
      <select>
        <option>Action</option>
        <option>Drama</option>
        <option>Comedy</option>
        <option>Horror</option>
        <option>Sci-Fi</option>
      </select>

      <label>Link ya Video (Embed / Direct)</label>
      <input type="url" placeholder="https://...">

      <label>Maelezo</label>
      <textarea placeholder="Andika maelezo mafupi ya filamu..."></textarea>

      <button class="btn">Hifadhi Filamu</button>
    </div>

    <div class="card">
      <h3>📋 Filamu Zilizopo</h3>
      <p style="color:var(--muted);font-size:0.9rem;">Orodha itaonekana hapa baada ya kuunganisha backend.</p>
    </div>
  </div>
</body>
</html>
